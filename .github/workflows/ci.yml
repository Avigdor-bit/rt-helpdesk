name: App CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: PostgreSQL and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: helpdesk_test
          POSTGRES_PASSWORD: disposable-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk_test -d helpdesk_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: helpdesk_test
      DB_USER: helpdesk_test
      DB_PASSWORD: disposable-test-password
      DB_SSLMODE: disable
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p test-results
      - run: python -m pytest -q --junitxml=test-results/results.xml
      - name: Build runtime image without publishing it
        run: docker build --target runtime -t rt-helpdesk:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/results.xml
          if-no-files-found: warn

  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look for Terraform files
        id: tf
        run: |
          if find . -path ./.git -prune -o -name '*.tf' -print -quit | grep -q .; then
            echo "found=true"  >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.tf.outputs.found == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: terraform fmt -check
        if: steps.tf.outputs.found == 'true'
        run: terraform fmt -check -recursive

      - name: terraform validate
        if: steps.tf.outputs.found == 'true'
        run: |
          for d in $(find . -path ./.git -prune -o -name '*.tf' -print | xargs -n1 dirname | sort -u); do
            echo "::group::validate $d"
            (cd "$d" && terraform init -backend=false -input=false -upgrade=false && terraform validate)
            echo "::endgroup::"
          done

      - name: Skip notice
        if: steps.tf.outputs.found == 'false'
        run: echo "No .tf files yet (Milestone 2) — skipping Terraform checks."
